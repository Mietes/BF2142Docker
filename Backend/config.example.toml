# Настройки бэкенда BF2142 (логин, статистика, анлоки). Пример: скопируй в config.toml.
# В Docker вместо файла обычно хватает переменных из .env (см. .env.example в корне).
# После изменения перезапусти бэкенд.

[network]
# На каком адресе слушать. 0.0.0.0 = на всех сетевых интерфейсах (для игры по сети),
# 127.0.0.1 = только этот компьютер (локальные тесты).
bind = "0.0.0.0"
# Адрес, по которому игроки и игровой сервер достучатся до бэкенда.
# Используется утилитами патча exe и в ответах сервера.
public_host = "127.0.0.1"

[ports]
# Порты FESL/GPCM/доступности зашиты в игре — менять не стоит.
fesl = 18300
gpcm = 29900
available = 27900
# Список серверов для вкладки «Интернет» (адрес зашит в игре).
server_browser = 28910
# Порт статистики. Если 80 занят, поставь, например, 8080 и перепатчи exe.
http = 80

[paths]
# Папка игры (клиента): из неё утилиты делают BF2142_selfhost.exe, в неё ставят патч Штаба,
# из неё собирается комплект для игроков. Путь абсолютный или относительно папки Backend.
game = "C:/Games/BF2142 Remaster"
# Папка дедик-сервера (для install_server.py / patch_server.py).
server = "../GameServer"

[accounts]
# Создавать аккаунт автоматически при первом входе с новым логином.
# Удобно для своих: регистрация из игры не нужна. Для публичного сервера выключи.
auto_register = true
# Максимум солдат на аккаунт.
max_soldiers = 4

[unlocks]
# "all"         — всем всё открыто (как на OpenSpy);
# "progression" — анлоки покупаются очками, которые даются за звания.
mode = "progression"
# Очки анлоков у нового солдата (сверх тех, что даёт звание).
start_credits = 3
# Сколько очков даёт звание: [с какого звания, по какое, очков за каждое].
# По умолчанию: звания 1–10 по 2 очка, 11–37 по 1. Всего шагов анлоков 50,
# так что к 37-му званию открывается всё (3 + 20 + 27).
credits_per_rank = [[1, 10, 2], [11, 37, 1]]
# Открывать ли гаджеты командира отделения (дроны и т.п.) в режиме "all".
# Боты в ваниле с ними не справляются, поэтому по умолчанию выключено.
squad_gadgets = false

[content]
# Дополнение Northern Strike (booster pack 1): выдавать всем игрокам. Без него игра
# не даёт выбирать бустерные поощрения и заходить на сервера с картами дополнения.
northern_strike = true

[stats]
# Засчитывать ли опыт за игры с ботами (кооп).
count_coop = true
# Игрок, пробывший в раунде меньше стольких секунд, опыта не получает.
min_round_seconds = 60

[xp]
# Бонусы к опыту за раунд (опыт решает звания; общий счёт для рейтинга без бонусов).
# Победа команды: +20%.
win_bonus = 0.2
# Первая победа за сутки: опыт ×2 (поверх бонуса за победу).
first_win_multiplier = 2.0
# Раунды с ботами (кооп): опыт ×0,5.
coop_multiplier = 0.5
# Во сколько часов (по времени сервера) начинаются новые сутки для «первой победы».
day_starts_hour = 4

[awards]
# Награды (значки, медали, ленты, значки отличия) по условиям из data/awards_backend.con.
enabled = true
# Бонусный опыт за каждую полученную награду (не умножается бонусами раунда).
# Значок: бронза, серебро, золото. Медали и значки отличия можно получать много раз.
xp_badge = [20, 100, 250]
xp_medal = 150
xp_ribbon = 100
xp_pin = 10

[ranks]
# Спецзвания 41–43 по опыту за прошлую неделю: 1-е место — 43, 2–3-е — 42, 4–10-е — 41.
weekly_top = true
# Претендовать могут только солдаты с этим званием и выше (40 = генерал).
weekly_top_min_rank = 40

[servers]
# Игровые серверы подписывают итоги раунда и админ-команды общим секретом, чужие запросы
# отклоняются. Пусто = взять из data/server_secret.txt (создаётся сам, install_server.py
# прописывает его в модуль сервера). Задавать вручную нужно, только если игровые серверы
# стоят на других машинах: тогда одна и та же строка здесь и в их selfhost_config.py.
secret = ""
# С каких адресов принимать запросы игровых серверов, например ["127.0.0.1"]. Пусто = с любых
# (подпись проверяется всегда).
allowed_ips = []

[admin]
# Солдаты-админы: команды в чате игры (!kick, !ban, !unban, !help). Пример: ["Tester1"].
admins = []
# Кик за бездействие через столько минут (0 = выключен). Командира и админов не кикает.
idle_kick_minutes = 5
# Веб-админка (игроки, звания, награды, анлоки, баны): http://127.0.0.1:8142/ — открывается только
# на этом компьютере. 0 — выключить.
web_port = 8142

[logging]
# DEBUG — видно все пакеты, INFO — только важное.
level = "INFO"
